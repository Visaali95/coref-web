[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "furniture-ml"
version = "1.0.0"
description = "Standalone PDF -> image extraction -> deduplication -> classification ML service"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
fml = "furniture_ml.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [".", "src"]
markers = [
"slow: end-to-end tests that actually train a small model",
]
filterwarnings = [
"ignore::DeprecationWarning",
"ignore::UserWarning",
]
